<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماركت الخير — متجر إلكتروني (نموذج TrioMind)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f5;--card:#fff;--text:#14261c;--muted:#6b7f73;--line:#e2ebe5;--brand:#0f8a4f;--brand-d:#0b6b3d;--accent:#ffb703}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button{font-family:inherit;cursor:pointer}
.demo-bar{background:#0b0d17;color:#cfd4e3;font-size:.85rem;text-align:center;padding:8px 12px}
.demo-bar b{color:#fff}.demo-bar a{color:#22d3ee;font-weight:700;margin-inline-start:6px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.35rem;color:var(--brand);white-space:nowrap}
.brand span{font-size:1.6rem}
.search{flex:1;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 40px 11px 14px;font-family:inherit;font-size:1rem}
.search::before{content:"🔍";position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:.95rem}
.cartbtn{position:relative;border:0;background:var(--brand);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:1rem;white-space:nowrap}
.cartbtn b{position:absolute;top:-7px;left:-7px;background:var(--accent);color:#14261c;min-width:22px;height:22px;border-radius:11px;font-size:.78rem;display:grid;place-items:center;padding:0 5px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.banner{margin-top:18px;border-radius:22px;background:linear-gradient(120deg,#0b6b3d,#0f8a4f 50%,#52b788);color:#fff;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:20px;overflow:hidden}
.banner h1{font-size:1.9rem;font-weight:800;line-height:1.3}
.banner p{opacity:.9;margin-top:6px}
.banner .em{font-size:4.5rem;white-space:nowrap}
.banner .tag{display:inline-block;background:var(--accent);color:#14261c;font-weight:800;padding:4px 12px;border-radius:99px;margin-bottom:10px;font-size:.9rem}
.cats{display:flex;gap:10px;overflow-x:auto;padding:20px 0 6px;scrollbar-width:none}
.cats button{flex:none;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 16px;font-size:.98rem;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.cats button.on{border-color:var(--brand);color:var(--brand);background:#e9f7ef;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:14px 0 50px}
.p{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative;transition:box-shadow .2s}
.p:hover{box-shadow:0 10px 26px rgba(15,138,79,.1)}
.p .img{height:120px;border-radius:14px;background:linear-gradient(135deg,#f1f8f4,#e3f2e9);display:grid;place-items:center;font-size:3.4rem}
.p .off{position:absolute;top:18px;right:18px;background:#e63946;color:#fff;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:8px}
.p h3{font-size:.98rem;font-weight:700;line-height:1.35}
.p small{color:var(--muted);font-size:.82rem}
.p .pr{display:flex;align-items:baseline;gap:6px;margin-top:auto}
.p .pr b{font-size:1.1rem;color:var(--brand-d)}
.p .pr s{color:#aab6ae;font-size:.85rem}
.p .btn{border:0;background:#e9f7ef;color:var(--brand);font-weight:700;border-radius:10px;padding:9px;font-size:.95rem}
.p .btn:hover{background:var(--brand);color:#fff}
.q{display:flex;align-items:center;justify-content:space-between;background:var(--brand);border-radius:10px;color:#fff;font-weight:700}
.q button{border:0;background:none;color:#fff;font-size:1.25rem;width:38px;height:38px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
.drawer{position:fixed;inset:0;background:rgba(10,30,20,.45);display:none;z-index:30}
.drawer.open{display:block}
.panel{position:absolute;top:0;bottom:0;left:0;width:min(420px,100%);background:#fff;display:flex;flex-direction:column}
.panel h2{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:1.25rem}
.panel h2 button{border:0;background:none;font-size:1.4rem;color:var(--muted)}
.list{flex:1;overflow:auto;padding:8px 18px}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .img{width:54px;height:54px;border-radius:12px;background:#f1f8f4;display:grid;place-items:center;font-size:1.8rem;flex:none}
.ci .nm{flex:1;font-size:.95rem}.ci .nm small{display:block;color:var(--muted)}
.ci .q{width:104px}.ci .q button{width:32px;height:32px}
.foot{padding:18px;border-top:1px solid var(--line)}
.sumrow{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--muted)}
.sumrow.t{color:var(--text);font-weight:800;font-size:1.2rem;margin:10px 0 14px}
.free{background:#fff8e1;border-radius:10px;padding:8px 12px;font-size:.88rem;margin-bottom:12px}
.bar{height:6px;background:#eee;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.checkout{width:100%;border:0;background:var(--brand);color:#fff;font-weight:800;font-size:1.05rem;padding:14px;border-radius:14px}
.checkout:disabled{opacity:.4}
.form label{display:block;font-size:.88rem;color:var(--muted);margin:10px 0 4px}
.form input,.form select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-family:inherit;font-size:1rem}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay label{margin:0;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:6px;align-items:center;color:var(--text);cursor:pointer}
.ok{text-align:center;padding:30px 10px}.ok .big{font-size:3.6rem}
.ok .code{display:inline-block;background:#e9f7ef;color:var(--brand-d);font-weight:800;padding:6px 16px;border-radius:10px;margin:10px 0;letter-spacing:1px;direction:ltr}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:#14261c;color:#fff;padding:10px 20px;border-radius:12px;transition:transform .3s;z-index:40;font-size:.95rem}
.toast.show{transform:translate(-50%,0)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:10px}.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}.brand{flex:1}.banner{padding:22px}.banner h1{font-size:1.4rem}.banner .em{font-size:3rem}.p .img{height:96px;font-size:2.8rem}}
</style>
</head>
<body>
<div class="demo-bar">🔹 نسخة تجريبية من <b>TrioMind</b> — بدك متجر متله لشغلك؟<a href="index.html#contact">اطلب الآن</a></div>
<header><div class="top">
  <div class="brand"><span>🛒</span>ماركت الخير</div>
  <div class="search"><input id="q" placeholder="ابحث عن منتج…"></div>
  <button class="cartbtn" id="openCart">🧺 السلة <b id="cnt">0</b></button>
</div></header>

<main class="wrap">
  <section class="banner">
    <div><span class="tag">عرض الأسبوع</span><h1>خصم حتى 25% على<br>الزيوت والبقوليات</h1><p><span id="freeTxt">توصيل مجاني للطلبات فوق 800 ج.م</span></p></div>
    <div class="em">🫒🌾</div>
  </section>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="drawer" id="drawer"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script src="currency.js"></script>
<script>
const CATS=[["all","🏪","الكل"],["oil","🫒","زيوت وسمن"],["grain","🌾","رز وبقوليات"],["dairy","🧀","ألبان وأجبان"],["drinks","🧃","مشروبات"],["snacks","🍫","سناكس"],["clean","🧼","منظفات"]];
const P=[
 {id:1,c:"oil",e:"🫒",n:"زيت زيتون بكر ممتاز",u:"1 لتر",p:420,o:520},
 {id:2,c:"oil",e:"🌻",n:"زيت عباد الشمس",u:"2.2 لتر",p:215,o:250},
 {id:3,c:"oil",e:"🧈",n:"سمن بلدي",u:"800 جم",p:260},
 {id:4,c:"grain",e:"🍚",n:"رز مصري فاخر",u:"5 كجم",p:195,o:230},
 {id:5,c:"grain",e:"🫘",n:"فول مدمس",u:"1 كجم",p:58},
 {id:6,c:"grain",e:"🌾",n:"عدس أصفر",u:"1 كجم",p:72,o:85},
 {id:7,c:"grain",e:"🍝",n:"مكرونة قلم",u:"400 جم",p:22},
 {id:8,c:"dairy",e:"🧀",n:"جبنة رومي",u:"500 جم",p:175},
 {id:9,c:"dairy",e:"🥛",n:"لبن كامل الدسم",u:"1 لتر",p:48},
 {id:10,c:"dairy",e:"🍶",n:"زبادي",u:"6 علب",p:60},
 {id:11,c:"dairy",e:"🥚",n:"بيض أحمر",u:"30 بيضة",p:165,o:180},
 {id:12,c:"drinks",e:"🧃",n:"عصير برتقال",u:"1 لتر",p:45},
 {id:13,c:"drinks",e:"☕",n:"بن تركي محوّج",u:"250 جم",p:135},
 {id:14,c:"drinks",e:"🍵",n:"شاي فتلة",u:"100 فتلة",p:95},
 {id:15,c:"snacks",e:"🍫",n:"شوكولاتة بالبندق",u:"100 جم",p:55},
 {id:16,c:"snacks",e:"🥜",n:"مكسرات مشكّلة",u:"250 جم",p:150,o:175},
 {id:17,c:"snacks",e:"🍪",n:"بسكويت بالتمر",u:"12 قطعة",p:40},
 {id:18,c:"clean",e:"🧼",n:"صابون سائل للأطباق",u:"1 لتر",p:52},
 {id:19,c:"clean",e:"🧺",n:"مسحوق غسيل أوتوماتيك",u:"3 كجم",p:230,o:260},
 {id:20,c:"clean",e:"🧻",n:"مناديل مطبخ",u:"6 رول",p:88}];
const cart={}; let cat="all", step="cart";
const $=s=>document.querySelector(s), money=n=>CUR.money(n), fmt=v=>CUR.fmt(v), cv=n=>CUR.conv(n);
const FREE=800, SHIP=40;

$("#cats").innerHTML=CATS.map(([k,e,n])=>`<button data-c="${k}" class="${k==="all"?"on":""}">${e} ${n}</button>`).join("");
$("#cats").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.c;document.querySelectorAll(".cats button").forEach(x=>x.classList.toggle("on",x===b));grid();};
$("#q").oninput=grid;

function ctl(id){return cart[id]?`<div class="q"><button data-a="+" data-id="${id}">+</button><span>${cart[id]}</span><button data-a="-" data-id="${id}">−</button></div>`:`<button class="btn" data-a="+" data-id="${id}">أضف للسلة</button>`}
function grid(){
  const q=$("#q").value.trim();
  const list=P.filter(p=>(cat==="all"||p.c===cat)&&(!q||p.n.includes(q)));
  $("#grid").innerHTML=list.length?list.map(p=>`<div class="p">${p.o?`<span class="off">-${Math.round((1-p.p/p.o)*100)}%</span>`:""}
   <div class="img">${p.e}</div><h3>${p.n}</h3><small>${p.u}</small>
   <div class="pr"><b>${money(p.p)}</b>${p.o?`<s>${money(p.o)}</s>`:""}</div>${ctl(p.id)}</div>`).join(""):`<div class="empty">لا توجد منتجات مطابقة 🔎</div>`;
  $("#cnt").textContent=Object.values(cart).reduce((a,b)=>a+b,0);
}
const sub=()=>Object.entries(cart).reduce((s,[id,q])=>s+cv(P.find(p=>p.id==id).p)*q,0);
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1400);}

document.body.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const id=b.dataset.id;
  const was=cart[id]||0;cart[id]=was+(b.dataset.a==="+"?1:-1);if(cart[id]<=0)delete cart[id];
  if(!was&&cart[id])toast("✓ تمت الإضافة للسلة");grid();if($("#drawer").classList.contains("open"))panel();});

function panel(){
  const s=sub(), F=cv(FREE), ship=s>=F||!s?0:cv(SHIP), items=Object.entries(cart);
  if(step==="done") return;
  if(step==="info"){
    $("#panel").innerHTML=`<h2>إتمام الطلب<button onclick="closeD()">✕</button></h2><div class="list form">
      <label>الاسم</label><input id="nm" placeholder="الاسم بالكامل">
      <label>رقم الموبايل</label><input id="ph" placeholder="01xxxxxxxxx" dir="ltr" style="text-align:right">
      <label>المحافظة</label><select><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>محافظة أخرى</option></select>
      <label>العنوان بالتفصيل</label><input placeholder="الحي، الشارع، رقم العمارة">
      <label>طريقة الدفع</label><div class="pay"><label><input type="radio" name="pm" checked> 💵 عند الاستلام</label><label><input type="radio" name="pm"> 💳 بطاقة / محفظة</label></div>
    </div><div class="foot"><div class="sumrow t"><span>الإجمالي</span><span>${fmt(s+ship)}</span></div>
      <button class="checkout" onclick="place()">تأكيد الطلب</button>
      <button onclick="step='cart';panel()" style="border:0;background:none;color:var(--muted);width:100%;margin-top:10px">← رجوع للسلة</button></div>`;
    return;
  }
  $("#panel").innerHTML=`<h2>سلة المشتريات<button onclick="closeD()">✕</button></h2>
   <div class="list">${items.length?items.map(([id,q])=>{const p=P.find(x=>x.id==id);return `<div class="ci"><div class="img">${p.e}</div><div class="nm">${p.n}<small>${money(p.p)} · ${p.u}</small></div>${ctl(id)}</div>`}).join(""):`<div class="empty">السلة فاضية 🧺</div>`}</div>
   <div class="foot">${s&&s<F?`<div class="free">أضف بـ <b>${fmt(F-s)}</b> كمان وخُد التوصيل مجاناً 🚚<div class="bar"><i style="width:${s/F*100}%"></i></div></div>`:s?`<div class="free">🎉 طلبك مؤهّل للتوصيل المجاني</div>`:""}
   <div class="sumrow"><span>المجموع</span><span>${fmt(s)}</span></div>
   <div class="sumrow"><span>التوصيل</span><span>${ship?fmt(ship):"مجاني"}</span></div>
   <div class="sumrow t"><span>الإجمالي</span><span>${fmt(s+ship)}</span></div>
   <button class="checkout" ${s?"":"disabled"} onclick="step='info';panel()">متابعة الشراء</button></div>`;
}
function place(){
  step="done"; const code="KH-"+Math.floor(10000+Math.random()*89999);
  $("#panel").innerHTML=`<h2>تم الطلب<button onclick="closeD()">✕</button></h2><div class="ok"><div class="big">🎉</div>
   <h3>شكراً! طلبك وصل</h3><div class="code">${code}</div>
   <p style="color:var(--muted)">في النسخة الحقيقية: الطلب بيظهر بلوحة تحكم المتجر، وبيوصل إشعار على واتساب، والزبون بيتابع حالة طلبه.</p>
   <button class="checkout" style="margin-top:18px" onclick="for(const k in cart)delete cart[k];closeD();grid()">متابعة التسوق</button>
   <a href="index.html#contact" style="display:block;margin-top:14px;color:var(--brand);font-weight:700">بدك متجر متل هيدا؟ ←</a></div>`;
}
function closeD(){$("#drawer").classList.remove("open"); if(step!=="info") step="cart";}
$("#openCart").onclick=()=>{step="cart";panel();$("#drawer").classList.add("open")};
$("#drawer").onclick=e=>{if(e.target.id==="drawer")closeD()};
function freeTxt(){$("#freeTxt").textContent="توصيل مجاني للطلبات فوق "+money(FREE);}
CUR.onChange(()=>{freeTxt();grid();if($("#drawer").classList.contains("open")&&step!=="done")panel();});
freeTxt();grid();
</script>
</body>
</html>
