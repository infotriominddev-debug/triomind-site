<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم — TrioMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#161a2b;--muted:#6f7690;--line:#e3e6ef;--brand:#6d4dff;--brand-l:#efebff;--ok:#15a34a;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button,input,textarea,select{font-family:inherit;font-size:1rem}
button{cursor:pointer}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;width:min(400px,100%);display:grid;gap:12px}
.login h1{font-size:1.4rem;text-align:center}
.login p{color:var(--muted);text-align:center;font-size:.9rem}
.logo{display:flex;justify-content:center}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
textarea{min-height:80px;resize:vertical;line-height:1.6}
.btn{border:0;background:var(--brand);color:#fff;border-radius:11px;padding:10px 18px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.l{background:var(--brand-l);color:var(--brand)}
.btn.g{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn.red{background:#fdecec;color:var(--bad)}
.err{color:var(--bad);font-size:.9rem;text-align:center;min-height:1.2em}
/* app */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar h1{font-size:1.05rem;flex:1;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.dirty{background:#f59e0b}
.tabs{max-width:980px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
main{max-width:980px;margin:0 auto;padding:18px 16px 120px}
.sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.sec>h2{font-size:1.05rem;margin-bottom:12px}
.f{margin-bottom:12px}
.f label{display:block;font-size:.86rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.f small{display:block;color:var(--muted);font-size:.78rem;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:18px;height:18px}
.item{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:#fbfbfe}
.ih{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.ih .n{width:26px;height:26px;border-radius:8px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.ih .t{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ih button{background:#fff;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;font-size:.9rem}
.ib{padding:4px 12px 12px;border-top:1px solid var(--line)}
.item.closed .ib{display:none}
.img{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.img .pv{width:120px;height:80px;border-radius:10px;border:1px dashed var(--line);background:#f4f5f9 center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:.8rem}
.img .acts{display:flex;gap:8px;flex-wrap:wrap}
.foot{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);z-index:20}
.foot .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
.foot .msg{flex:1;color:var(--muted);font-size:.9rem}
.save{padding:12px 28px;font-size:1.02rem}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-150%);background:#161a2b;color:#fff;padding:11px 22px;border-radius:12px;transition:transform .3s;z-index:50}
.toast.show{transform:translate(-50%,0)}
.note{background:#fff8e6;border:1px solid #fde7b0;border-radius:12px;padding:12px;font-size:.9rem;margin-bottom:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.bar h1 span.hide-m{display:none}.save{padding:12px 18px}}
</style>
</head>
<body>

<!-- تسجيل الدخول -->
<div class="login" id="loginView">
  <form id="loginForm">
    <div class="logo"><svg viewBox="0 0 64 64" width="54" height="54"><circle cx="22" cy="40" r="11" fill="#7c5cff"/><circle cx="42" cy="40" r="11" fill="#22d3ee" fill-opacity=".9"/><circle cx="32" cy="22" r="11" fill="#f472b6" fill-opacity=".9"/></svg></div>
    <h1>لوحة التحكم</h1>
    <p>ادخل بالإيميل وكلمة السر</p>
    <input id="em" type="email" placeholder="الإيميل" dir="ltr" autocomplete="username" required>
    <input id="pw" type="password" placeholder="كلمة السر" dir="ltr" autocomplete="current-password" required>
    <button class="btn" id="loginBtn">دخول</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- اللوحة -->
<div class="hidden" id="appView">
  <div class="top">
    <div class="bar">
      <h1><span class="dot" id="dot"></span> لوحة التحكم <span class="hide-m" style="color:var(--muted);font-weight:400">— الموقع</span></h1>
      <a class="btn g sm" href="index.html" target="_blank" rel="noopener">👁️ معاينة</a>
      <button class="btn g sm" id="logout">خروج</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <main id="main"></main>
  <div class="foot"><div class="in">
    <span class="msg" id="msg">كل التعديلات محفوظة</span>
    <button class="btn save" id="saveBtn">💾 حفظ ونشر</button>
  </div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="content-default.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function toast(t, ms = 1800) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), ms); }
function merge(base, over) {
  if (Array.isArray(base) || Array.isArray(over)) return Array.isArray(over) ? over : base;
  if (base && typeof base === "object") { const o = { ...base }; for (const k in (over || {})) o[k] = (k in base) ? merge(base[k], over[k]) : over[k]; return o; }
  return over === undefined || over === null ? base : over;
}
const getP = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
const setP = (o, p, v) => { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach(k => a = a[k] ??= {}); a[ks.at(-1)] = v; };

/* ===== تعريف الحقول ===== */
const COLORS = [["violet", "بنفسجي"], ["pink", "وردي"], ["green", "أخضر"], ["blue", "أزرق"], ["indigo", "نيلي"], ["red", "أحمر"], ["orange", "برتقالي"], ["emerald", "زمردي"], ["teal", "فيروزي"], ["night", "كحلي"], ["gold", "ذهبي"]];
const ZONES = [["Africa/Cairo", "مصر"], ["Asia/Beirut", "لبنان"], ["Asia/Damascus", "سوريا"], ["Asia/Riyadh", "السعودية"], ["Asia/Dubai", "الإمارات"], ["Asia/Kuwait", "الكويت"], ["Asia/Qatar", "قطر"], ["Asia/Amman", "الأردن"], ["Asia/Baghdad", "العراق"], ["", "بدون"]];
const T = (key, label, hint) => ({ t: "text", key, label, hint });
const A = (key, label, hint) => ({ t: "area", key, label, hint });
const N = (key, label) => ({ t: "num", key, label });
const I = (key, label) => ({ t: "img", key, label });
const B = (key, label) => ({ t: "bool", key, label });
const S = (key, label, opts) => ({ t: "sel", key, label, opts });
const L = (key, label, fields, titleKey) => ({ t: "list", key, label, fields, titleKey });
const G = (title, fields) => ({ t: "group", title, fields });
const HEADS = s => [T(s + ".eyebrow", "العنوان الصغير"), T(s + ".title", "العنوان الرئيسي"), A(s + ".sub", "الوصف")];
const PRICE = [T("title", "اسم الخدمة"), A("desc", "الوصف"), N("usd", "💵 السعر بالدولار"), T("unit", "الوحدة (اختياري)", "مثلاً: ساعة، يوم، شهر — واتركها فاضية إذا مش لازم")];

const TABS = [
  { id: "home", title: "🏠 الرئيسية", groups: [
    G("الهوية", [T("brand.name", "اسم الشركة"), I("brand.logo", "الشعار (اختياري — إذا ما في، بيبيّن الشعار الافتراضي)"), T("brand.cta", "زر أعلى الصفحة")]),
    G("أعلى الصفحة", [T("hero.badge", "الشارة الصغيرة"), T("hero.title", "العنوان — السطر الأول"), T("hero.accent", "العنوان — السطر الملوّن"), A("hero.lead", "الوصف"), T("hero.cta1", "الزر الأول"), T("hero.cta2", "الزر الثاني"), I("hero.image", "صورة جنب العنوان (اختياري — بدل الرسمة)"),
      L("hero.stats", "الأرقام تحت العنوان", [T("value", "الرقم", "مثلاً: 37,000+"), T("label", "الوصف")], "value")]),
    G("الظهور على Google", [T("seo.title", "عنوان الصفحة"), A("seo.description", "وصف الموقع")])
  ]},
  { id: "services", title: "🧩 الخدمات", groups: [
    G("عنوان القسم", HEADS("services")),
    G("الخدمات", [L("services.items", "الخدمات", [T("icon", "الأيقونة (إيموجي)", "انسخ أي إيموجي: 📱 🌐 📊 ✨ 🗄️ 📣 🔄 💡 🎓 🛒 🎨"), T("title", "اسم الخدمة"), A("desc", "الوصف")], "title")])
  ]},
  { id: "work", title: "💼 الأعمال", groups: [
    G("عنوان القسم", HEADS("work")),
    G("المشاريع", [L("work.items", "المشاريع", [I("image", "صورة المشروع (اختياري)"), T("name", "الاسم الكبير على الخلفية (إذا ما في صورة)"), T("subtitle", "سطر صغير تحت الاسم"), S("color", "لون الخلفية", COLORS), B("big", "كرت عريض (بعرض الصفحة)"),
      T("title", "عنوان المشروع"), A("desc", "الوصف"), T("tags", "الوسوم", "افصل بينها بفاصلة، مثلاً: تطبيق ويب، اشتراكات"),
      T("m1v", "رقم مميّز 1 (اختياري)", "مثلاً: 37K+"), T("m1l", "وصف الرقم 1"), T("m2v", "رقم مميّز 2 (اختياري)"), T("m2l", "وصف الرقم 2"),
      T("link", "رابط المشروع (اختياري)", "مثلاً: https://mamsteps.com"), T("linkText", "نص الرابط", "مثلاً: زيارة التطبيق")], "title")])
  ]},
  { id: "demos", title: "🧪 النماذج", groups: [
    G("عنوان القسم", [...HEADS("demos"), T("demos.button", "نص الزر")]),
    G("النماذج", [L("demos.items", "النماذج", [T("emoji", "إيموجي"), I("image", "صورة (اختياري — بدل الإيموجي)"), S("color", "لون الخلفية", COLORS), T("title", "العنوان"), A("desc", "الوصف"), T("link", "الرابط", "مثلاً: demo-restaurant.html")], "title")])
  ]},
  { id: "pricing", title: "💰 الأسعار", groups: [
    G("عنوان القسم", [...HEADS("pricing"), T("pricing.fromText", "كلمة «يبدأ من»")]),
    G("💱 العملات وأسعار الصرف", [{ t: "info", text: "كل الأسعار بتنكتب بالدولار، وبتبيّن كبيرة بالدولار للكل. تحت كل سعر سطر صغير فيه المعادل بالجنيه واليورو وعملة بلد الزائر، محسوب من أسعار الصرف هون. إذا حطيت سعر صرف 0 لعملة، ما بتبيّن." },
      N("pricing.rates.EGP", "🇪🇬 الجنيه المصري — كم جنيه = 1$"), N("pricing.rates.SAR", "🇸🇦 الريال السعودي — كم ريال = 1$"), N("pricing.rates.AED", "🇦🇪 الدرهم الإماراتي — كم درهم = 1$"), N("pricing.rates.KWD", "🇰🇼 الدينار الكويتي — كم دينار = 1$"), N("pricing.rates.QAR", "🇶🇦 الريال القطري — كم ريال = 1$"), N("pricing.rates.JOD", "🇯🇴 الدينار الأردني — كم دينار = 1$"), N("pricing.rates.EUR", "🇪🇺 اليورو — كم يورو = 1$")]),
    G("البرمجة والتطوير", [T("pricing.devTitle", "عنوان المجموعة"), L("pricing.dev", "الخدمات", PRICE, "title")]),
    G("خدمات مستمرة", [T("pricing.ongoingTitle", "عنوان المجموعة"), L("pricing.ongoing", "الخدمات", PRICE, "title")]),
    G("باقات التسويق", [T("pricing.plansTitle", "عنوان المجموعة"),
      L("pricing.plans", "الباقات", [T("name", "اسم الباقة"), N("usd", "💵 السعر الشهري بالدولار"), B("hot", "مميّزة (الأكثر طلباً)"), A("features", "المميزات", "كل ميزة بسطر لحالها")], "name"),
      T("pricing.hotLabel", "نص شارة «الأكثر طلباً»"), T("pricing.planButton", "نص زر الباقة"), A("pricing.note", "ملاحظة تحت الباقات")]),
    G("الشروط", [L("pricing.terms", "الشروط", [T("title", "العنوان"), A("text", "النص")], "title")])
  ]},
  { id: "process", title: "🪜 طريقة العمل", groups: [
    G("عنوان القسم", [T("process.eyebrow", "العنوان الصغير"), T("process.title", "العنوان الرئيسي")]),
    G("الخطوات", [L("process.steps", "الخطوات", [T("title", "العنوان"), A("text", "النص")], "title")])
  ]},
  { id: "why", title: "⭐ لماذا نحن", groups: [
    G("عنوان القسم", [T("why.eyebrow", "العنوان الصغير"), T("why.title", "العنوان الرئيسي")]),
    G("النقاط", [L("why.points", "النقاط", [T("title", "العنوان"), A("text", "النص")], "title")]),
    G("المربع الجانبي", [T("why.quoteTitle", "العنوان الكبير"), A("why.quoteText", "النص"), T("why.tech", "التقنيات", "افصل بينها بفاصلة")])
  ]},
  { id: "contact", title: "📞 التواصل", groups: [
    G("عنوان القسم", HEADS("contact")),
    G("أرقام الواتساب", [L("contact.whatsapp", "الأرقام", [T("country", "اسم البلد"), T("flag", "العلم (إيموجي)", "مثلاً: 🇪🇬 🇱🇧 🇸🇾 🇸🇦 🇦🇪"), T("number", "الرقم", "بالصيغة الدولية بدون + وبدون صفر. مثلاً مصر: 201012345678 — لبنان: 96171234567"), S("zones", "يفتح تلقائياً لزوار من", ZONES)], "country"),
      A("contact.hello", "رسالة الواتساب الجاهزة")]),
    G("معلومات أخرى", [T("contact.email", "الإيميل"), A("contact.projectTypes", "أنواع المشاريع بالفورم", "كل نوع بسطر"),
      T("contact.facebook", "رابط فيسبوك (اختياري)"), T("contact.instagram", "رابط إنستغرام (اختياري)"), T("contact.tiktok", "رابط تيك توك (اختياري)"), T("contact.linkedin", "رابط لينكدإن (اختياري)")])
  ]}
];

/* ===== الحالة ===== */
const cfg = window.SITE_CONFIG || {};
let sb, data, saved, tab = "home", dirty = false, uid = 0;
const open = new Set();

function setDirty(v) {
  dirty = v; $("#dot").classList.toggle("dirty", v);
  $("#msg").textContent = v ? "في تعديلات ما انحفظت" : "كل التعديلات محفوظة";
}

/* ===== رسم الحقول ===== */
function fieldHTML(f, obj, path) {
  const id = "f" + (++uid), v = getP(obj, f.key);
  const full = path ? path + "." + f.key : f.key;
  const hint = f.hint ? `<small>${esc(f.hint)}</small>` : "";
  if (f.t === "info") return `<div class="note">${esc(f.text)}</div>`;
  if (f.t === "text") return `<div class="f"><label for="${id}">${esc(f.label)}</label><input id="${id}" data-p="${full}" value="${esc(v)}">${hint}</div>`;
  if (f.t === "area") return `<div class="f"><label for="${id}">${esc(f.label)}</label><textarea id="${id}" data-p="${full}">${esc(v)}</textarea>${hint}</div>`;
  if (f.t === "num") return `<div class="f"><label for="${id}">${esc(f.label)}</label><input id="${id}" type="number" min="0" step="any" dir="ltr" data-p="${full}" data-num="1" value="${esc(v)}"></div>`;
  if (f.t === "bool") return `<div class="f"><label class="chk"><input type="checkbox" data-p="${full}" data-bool="1" ${v ? "checked" : ""}> ${esc(f.label)}</label></div>`;
  if (f.t === "sel") return `<div class="f"><label for="${id}">${esc(f.label)}</label><select id="${id}" data-p="${full}">${f.opts.map(([k, l]) => `<option value="${esc(k)}" ${k === (v || "") ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>`;
  if (f.t === "img") return `<div class="f"><label>${esc(f.label)}</label><div class="img">
      <div class="pv" style="${v ? `background-image:url('${esc(v)}')` : ""}">${v ? "" : "لا يوجد"}</div>
      <div class="acts"><label class="btn l sm" style="cursor:pointer">📤 رفع صورة<input type="file" accept="image/*" hidden data-up="${full}"></label>${v ? `<button class="btn red sm" data-clear="${full}">إزالة</button>` : ""}</div></div></div>`;
  if (f.t === "list") {
    const arr = getP(obj, f.key) || [];
    return `<div class="f"><label>${esc(f.label)} (${arr.length})</label>${arr.map((it, i) => {
      const key = full + "." + i, closed = !open.has(key);
      return `<div class="item ${closed ? "closed" : ""}"><div class="ih" data-toggle="${key}"><span class="n">${i + 1}</span><span class="t">${esc(it[f.titleKey] || "(بدون عنوان)")}</span>
        <button data-mv="${full}|${i}|-1" title="لفوق">↑</button><button data-mv="${full}|${i}|1" title="لتحت">↓</button><button data-del="${full}|${i}" title="حذف">🗑️</button></div>
        <div class="ib">${f.fields.map(sf => fieldHTML(sf, it, key)).join("")}</div></div>`;
    }).join("")}<button class="btn l sm" data-add="${full}" data-tpl='${esc(JSON.stringify(Object.fromEntries(f.fields.map(sf => [sf.key, sf.t === "num" ? 0 : sf.t === "bool" ? false : sf.t === "sel" ? sf.opts[0][0] : ""]))))}'>+ إضافة</button></div>`;
  }
  return "";
}
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(t => `<button data-tab="${t.id}" class="${t.id === tab ? "on" : ""}">${t.title}</button>`).join("");
}
function renderMain() {
  const t = TABS.find(x => x.id === tab); uid = 0;
  $("#main").innerHTML = (tab === "home" ? `<div class="note">💡 عدّل اللي بدك ياه، وبالآخر اضغط <b>«حفظ ونشر»</b> تحت. التعديلات بتبيّن على الموقع فوراً.</div>` : "") +
    t.groups.map(g => `<div class="sec"><h2>${esc(g.title)}</h2>${g.fields.map(f => fieldHTML(f, data, "")).join("")}</div>`).join("") +
    (tab === "home" ? `<div class="sec"><h2>نسخة احتياطية</h2><button class="btn g sm" id="backup">⬇️ تنزيل نسخة من كل المحتوى</button></div>` : "");
}
function rerender() { const y = scrollY; renderMain(); scrollTo(0, y); }

/* ===== الأحداث ===== */
$("#main").addEventListener("input", e => {
  const el = e.target; if (!el.dataset.p) return;
  let v = el.dataset.bool ? el.checked : el.dataset.num ? (el.value === "" ? 0 : +el.value) : el.value;
  setP(data, el.dataset.p, v); setDirty(true);
});
$("#main").addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.up) return upload(el);
});
$("#main").addEventListener("click", e => {
  const b = e.target.closest("button,[data-toggle]"); if (!b) return;
  if (b.id === "backup") return backup();
  if (b.dataset.clear) { setP(data, b.dataset.clear, ""); setDirty(true); return rerender(); }
  if (b.dataset.add) { const arr = getP(data, b.dataset.add); arr.push(JSON.parse(b.dataset.tpl)); open.add(b.dataset.add + "." + (arr.length - 1)); setDirty(true); return rerender(); }
  if (b.dataset.del) { const [p, i] = b.dataset.del.split("|"); if (!confirm("متأكد بدك تحذف هالعنصر؟")) return; getP(data, p).splice(+i, 1); open.clear(); setDirty(true); return rerender(); }
  if (b.dataset.mv) { const [p, i, d] = b.dataset.mv.split("|"), a = getP(data, p), j = +i + +d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; open.clear(); setDirty(true); return rerender(); }
  if (b.dataset.toggle) { const k = b.dataset.toggle; open.has(k) ? open.delete(k) : open.add(k); b.parentElement.classList.toggle("closed"); }
});
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.tab; open.clear(); renderTabs(); renderMain(); scrollTo(0, 0); });
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ===== رفع الصور ===== */
async function shrink(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  const bmp = await createImageBitmap(file); const max = 1600;
  if (bmp.width <= max && file.size < 600000) return file;
  const r = Math.min(1, max / bmp.width), c = document.createElement("canvas");
  c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const type = file.type === "image/png" ? "image/png" : "image/jpeg";
  return await new Promise(res => c.toBlob(b => res(new File([b], file.name, { type })), type, .85));
}
async function upload(input) {
  const file = input.files[0]; if (!file) return;
  if (file.size > 10e6) return toast("الصورة كبيرة كتير (أكثر من 10MB)");
  toast("⏳ عم نرفع الصورة…", 60000);
  try {
    const f = await shrink(file);
    const ext = (f.type.split("/")[1] || "jpg").replace("jpeg", "jpg");
    const path = `img/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
    const { error } = await sb.storage.from("site").upload(path, f, { contentType: f.type, cacheControl: "31536000" });
    if (error) throw error;
    const url = sb.storage.from("site").getPublicUrl(path).data.publicUrl;
    setP(data, input.dataset.up, url); setDirty(true); rerender(); toast("✅ انرفعت الصورة — لا تنسى تضغط حفظ");
  } catch (err) { toast("❌ ما انرفعت الصورة: " + (err.message || err), 4000); }
}

/* ===== الحفظ ===== */
$("#saveBtn").onclick = async () => {
  const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "⏳ عم نحفظ…";
  const { error } = await sb.from("site_settings").upsert({ id: 1, data, updated_at: new Date().toISOString() });
  btn.disabled = false; btn.textContent = "💾 حفظ ونشر";
  if (error) return toast("❌ ما انحفظ: " + error.message, 4000);
  saved = clone(data); setDirty(false); toast("✅ انحفظ وصار على الموقع");
};
function backup() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = "triomind-content-" + new Date().toISOString().slice(0, 10) + ".json"; a.click();
}

/* ===== الدخول ===== */
async function enter() {
  const { data: isAdmin, error } = await sb.rpc("is_site_admin");
  if (error || !isAdmin) { await sb.auth.signOut(); $("#loginErr").textContent = error ? "في مشكلة بقاعدة البيانات — تأكد إنك شغّلت ملف setup.sql" : "هالإيميل مش مسموح له يدخل على اللوحة"; return; }
  const { data: rows, error: e2 } = await sb.from("site_settings").select("data").eq("id", 1).maybeSingle();
  if (e2) { $("#loginErr").textContent = "ما قدرنا نجيب المحتوى: " + e2.message; return; }
  data = merge(clone(DEFAULT_CONTENT), (rows && rows.data) || {}); saved = clone(data);
  $("#loginView").classList.add("hidden"); $("#appView").classList.remove("hidden");
  renderTabs(); renderMain(); setDirty(false);
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginErr").textContent = ""; const b = $("#loginBtn"); b.disabled = true; b.textContent = "⏳";
  const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
  b.disabled = false; b.textContent = "دخول";
  if (error) { $("#loginErr").textContent = /Invalid login/i.test(error.message) ? "الإيميل أو كلمة السر غلط" : error.message; return; }
  enter();
};
$("#logout").onclick = async () => { if (dirty && !confirm("في تعديلات ما انحفظت. بدك تطلع؟")) return; dirty = false; await sb.auth.signOut(); location.reload(); };

(async () => {
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_KEY || !window.supabase) {
    $("#loginErr").textContent = "لازم تعبّي config.js بمعلومات Supabase أول"; $("#loginBtn").disabled = true; return;
  }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (session) enter();
})();
</script>
</body>
